services:
  - type: web
    name: shop-telegram-bot
    env: docker # ✅ مهم: نحدد أن الخدمة مبنية من Dockerfile
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true # Render يولّد قيمة تلقائيًا إذا ما أضفتها يدوياً
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://shop-telegram-bot.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false # ⚠️ لازم تضيف التوكن يدوياً في لوحة التحكم Render
      - key: TELEGRAM_WEBHOOK_URL
        value: https://shop-telegram-bot.onrender.com/webhook
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: shop-bot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shop-bot-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: shop-bot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: shop-bot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shop-bot-db
          property: password

databases:
  - name: shop-bot-db
    databaseName: shop_bot
    user: shop_user
